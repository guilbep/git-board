[fields.status]
single = true
options = ["backlog", "ready", "in-progress", "done"]

[fields.prio]
single = true
options = ["p0", "p1", "p2", "p3"]

[fields.est]
single = true
numeric = true
options = ["1", "2", "4", "8"]

# one field a type, for the type's own form
[fields.due]
type = "date"

[fields.sprint]
single = true

# a date by its values alone; a select a test turns into an issue
[fields.when]
options = ["2026-01-01", "2026-02-01"]

[fields.size]
options = ["s", "m", "l"]
colors = { s = "green" }

# the kinds are flat: plain labels, no [fields.kind]
[branches.kinds]
bug = "bug"
feat = "feat"

# the cycle is experimental: on, so Settings › Cycle shows
[experimental]
features = ["cycle"]

# what the forms don't show, and must keep
[cycle]
ready = "ready"
test-files = ["*_test.go"]
criteria = ["it works"]
plans-in-pr = false

[release]
environments = ["dev", "prod"]
follow = ""
binaries = ["./cmd/x"]
platforms = ["linux/amd64"]
build = "make dist"

[repos]
list = ["o/r"]
assignees = "labels"

[[sprints.list]]
slug = "s1"
title = "Sprint 1"
start = 2026-10-05

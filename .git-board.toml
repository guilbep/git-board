# git-board's own board: its issues are git-bug data in this repository
# (refs/bugs, pushed with `git bug push origin`), managed with git-board
# itself. Every key is explained in docs/configuration.md, and beside the
# editor in Settings → Project configuration.

[fields.status]
single = true
options = ["draft", "backlog", "ready", "in-progress", "in-review", "done"]

[fields.moscow]
single = true
options = ["musthave", "shouldhave", "couldhave", "wonthave"]

[fields.moscow.colors]
"musthave" = "#D73A4A"
"shouldhave" = "#A2EEEF"
"couldhave"= "#7057FF"
"wonthave" = "#E6E6E6"

[fields.prio]
single = true
options = ["p0", "p1", "p2", "p3"]

[fields.kind]
single = true
options = ["feat", "bug", "doc", "chore"]

[fields.est]
single = true
numeric = true
options = ["1", "2", "4", "8", "16"]

# the project's people by role (docs/configuration.md, Roles): every issue
# takes them unless it sets its own, e.g. lead-dev:someone
[roles]
lead-dev = "guilbep"

# the ontology's links and dates (docs/configuration.md, Types)
[fields.due]
type = "date"

[fields.parent]
type = "issue"

[views.board]
layout = "board"
filter = "is:open"
group = "status"
sort = "prio asc"
lanes = ["backlog", "ready", "in-progress", "in-review"]

[views.drafts]
layout = "table"
filter = "is:open status:draft"

[views.mine]
layout = "table"
filter = "assignee:@me is:open -status:done"

# git-board's own binary release (docs/configuration.md, Release): a cut
# runs the build in a clean checkout of the tag and publishes the archives
# as the GitHub release. Enable binary release wrote build = "make dist";
# a clean checkout has no web/node_modules, so the build installs them.
[release]
binaries = ["./cmd/git-board"]
platforms = ["linux/amd64", "linux/arm64", "darwin/amd64", "darwin/arm64", "windows/amd64"]
build = "(cd web && npm ci) && make dist"


# The dogfooding job (docs/rewrite/design.md, section 5): this
# repository's own board, read by v1 and by v2. It fetches the board's
# refs (refs/board/*, docs/spec/storage.md), builds v1 from the release tag
# (OLD_REF: the newest v0.11.* tag, or the old_ref input) and v2 from this
# commit, and `make dogfood` diffs ls --json and show --json of every
# issue, with make compat's normalisations. Any difference fails the job;
# the differing outputs and their diff are uploaded. Daily, and by hand.
# It writes nothing: no push, no tag, nothing fetched but the board.
name: dogfood

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      old_ref:
        description: "v1's ref to build OLD from (default: the newest v0.11.* tag)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: dogfood
  cancel-in-progress: true

jobs:
  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags: OLD is built from one

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: The board's refs
        run: |
          git fetch --no-tags origin '+refs/board/*:refs/board/*'
          git for-each-ref --format='%(refname)' refs/board/ | cut -d/ -f3 | sort | uniq -c

      - name: make dogfood
        env:
          OLD_REF_INPUT: ${{ inputs.old_ref }}
        run: |
          ref="${OLD_REF_INPUT:-$(git tag -l 'v0.11.*' --sort=-v:refname | head -1)}"
          make dogfood DIR=. OLD_REF="$ref" DOGFOOD_OUT=dogfood-out

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dogfood-diff
          path: dogfood-out/
          retention-days: 30

      - if: failure()
        run: |
          if [ -f dogfood-out/dogfood.diff ]; then
            { echo '## dogfood: v1 and v2 differ'; echo '```diff'; head -c 60000 dogfood-out/dogfood.diff; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

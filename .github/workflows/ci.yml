# Every pull request, and every push to main: set up Go and Node, then
# `make ci`, the same run as on a developer's machine (web checks and build,
# then Go build, vet, test, gofmt).
name: ci

on:
  push:
    branches: [main] # a branch's pushes run once, through its pull request
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # runs web/src/facets.test.ts as is (type stripping)
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Git identity for the tests' throwaway repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com

      - run: make ci

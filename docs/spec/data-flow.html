read: the GitHub Project bridge's [github-project], the uploads' [uploads], lint's [template].","imports":["conf"],"files":1},{"id":"tools/branches","doc":"Package branches is an issue's code: the branch it suggests creating, named from [branches], and the branches whose name names it.","imports":["domain/issues","tools/code"],"files":1},{"id":"tools/code","doc":"Package code is a repository's code, beside its board: branches and commits, read with the git binary (ADR 0021: reads through git, not go-git).","imports":[],"files":1},{"id":"tools/ghproject","doc":"Package ghproject is the GitHub Project bridge: a Project's fields (single select, iteration, number, date, text) kept in step with the board's fields, which are labels (ADR 0007), both ways.","imports":["domain/issues","forge","forge/github","kernel","sync"],"files":2},{"id":"tools/insights","doc":"Package insights replays every issue's label and status changes, which the board keeps with their time, into what a project manager asks: how the work flowed each day (a cumulative flow), how many issues close a week, how long an issue takes once started, how the current sprint is burning up, and the board as it was on any day.","imports":[],"files":2},{"id":"tools/ship","doc":"Package ship is how git-board ships an app's releases: it cuts them, promotes, deploys and rolls them back, adopts the overlays, and reads what runs where.","imports":["domain/issues","domain/releases","forge","tools/branches","tools/code"],"files":10},{"id":"tools/uploads","doc":"Package uploads puts the files attached to issue text on S3, where a CDN serves them to everyone who reads the issue — in git-board, on GitHub, on GitLab.","imports":["tools"],"files":1},{"id":"view","doc":"Package view keeps the board's read model in sqlite: every kind's rows, terms and texts, keyed by the version each was folded at, and per kind the listing they are at (docs/rewrite/design.md, The read path).","imports":["kernel","kernel/search"],"files":3}],"params":[{"id":"store","label":"board.datastore","options":[{"id":"git","name":"git","pkg":"store/git","type":"Store"},{"id":"pg","name":"PostgreSQL","pkg":"store/pg","type":"Store"},{"id":"md","name":"Markdown","pkg":"store/md","type":"Store"},{"id":"forgecopy","name":"forges alone","pkg":"store/forgecopy","type":"Store"}]},{"id":"forge","label":"forge","options":[{"id":"github","name":"GitHub","pkg":"forge/github","type":"Forge"},{"id":"gitlab","name":"GitLab","pkg":"forge/gitlab","type":"Forge"}]}],"stories":[{"id":"write","tab":"A write","title":"A write: one comment, from the page to the bytes","intro":"One write is one pack, added only if the issue is still at the version it was read at. No lock: the compare-and-swap is the only guard, a sync included.","toggles":[{"id":"moved","label":"the issue moves meanwhile","tag":"ErrMoved, read and decide again, 5 tries"}],"steps":[{"hops":"browser -\u003e surface/http","routes":["surface/http:POST /api/issues/{id}/comments"],"label":"POST /api/issues/{id}/comments","text":"The page sends the comment, with the version it showed in If-Match."},{"node":"surface/http","calls":["surface/http.addComment","surface/http.Route"],"label":"addComment","text":"An adapter: the route decodes the request into a struct, checks the body isn't empty, and calls the application. No rule lives here."},{"hops":"surface/http -\u003e domain/issues","calls":["domain/issues.Service.Comment","domain/issues.Service.writing"],"label":"Issues.Comment(ctx, id, body)","text":"The issue domain owns the rules. writing gives the request one snapshot of the board."},{"hops":"domain/issues -\u003e kernel","calls":["domain/issues.Service.do","kernel.K.Do"],"label":"Kind.Do(ctx, board, id, decide)","text":"The kernel reads the entity, asks the domain what to write, and writes it."},{"hops":"kernel -\u003e store -\u003e $store","calls":["kernel.Board.entity","store.Datastore.Load","$store.$storeType.Load"],"label":"Load(issue/id) → packs, version v","text":"Every pack of the issue, and the version they were read at.","by":{"store=forgecopy":"From the git copy in .git/board/forge-copy.git: the git datastore, in the clone's own folder.","store=git":"From refs/board/issue/\u003cid\u003e: the objects read in process, through go-git's storage.","store=md":"From \u003cdir\u003e/.board/issue/\u003cid\u003e.jsonl, one pack a line.","store=pg":"From git_board.packs, the version from git_board.entities."}},{"node":"kernel","calls":["kernel.K.fold","kernel.pending"],"label":"fold · decide · fold(pending)","text":"The state is folded, decide returns the comment operation, and the state is folded again with it: an operation that wouldn't apply is refused before anything is written."},{"hops":"kernel -\u003e kernel/pack","calls":["kernel.Board.write","kernel/pack.Encode","kernel/pack.Hash"],"label":"pack{clock: head + 1, ops}","text":"One pack, its clock one above the head's. Its id is the git blob hash of its bytes, so an operation's id is the same in every datastore."},{"hops":"kernel -\u003e store -\u003e $store","calls":["store.Datastore.Add","$store.$storeType.Add"],"label":"Add(issue, id, pack, prev = v)","text":"Compare-and-swap: stored only if the issue is still at v.","by":{"store=forgecopy":"A commit in the forge copy. The forges hear of it at the next sync.","store=git":"A commit on refs/board/issue/\u003cid\u003e, moved by git update-ref from v.","store=md":"One more line in .board/issue/\u003cid\u003e.jsonl, under the folder's board.lock.","store=pg":"A row in git_board.packs, the version in git_board.entities moved from v, in one transaction."}},{"hops":"$store -\u003e store -\u003e kernel","calls":["store.ErrMoved"],"label":"ErrMoved","text":"Someone wrote first: another clone, the command line, a sync. The datastore refuses the pack.","when":"moved","warn":true},{"hops":"kernel -\u003e store -\u003e $store","calls":["kernel.tries"],"label":"Load again, decide again, Add","text":"Do starts over on the new head, so the decision always sees the head it is written on. Up to five tries.","when":"moved"},{"hops":"kernel -\u003e view","calls":["kernel.K.through","kernel.View.Write","view.View.Write","view.PG.Write"],"label":"through: the row, where still at v","text":"Write-through: the new pack sorts last, so the new state is the old one with the new operations applied, never a fold from the start. The view's row is replaced where it is still at v: this process reads its own write without a listing.","by":{"store=pg":"Write-through: the new state is the old one with the new operations applied. On PostgreSQL the view is in the database too, in git_board_view_v1, shared by every machine."}},{"node":"kernel","calls":["kernel.Board.landed","kernel.Board.Observe"],"label":"landed: tell the observers","text":"The observers registered on the board hear of the change, once it is in the datastore."},{"hops":"kernel -\u003e domain/issues/mdfiles","calls":["domain/issues/mdfiles.Folder.observe"],"label":"render NNN-slug.md","text":"On a Markdown board, the folder's observer renders the issue's file.","when":"store=md"},{"hops":"kernel -\u003e surface/http","calls":["surface/http.Server.observe","surface/http.Server.publish"],"label":"Server.observe → an event","text":"The server's observer publishes the change as it lands, without waiting for the next tick."},{"hops":"kernel -\u003e domain/issues -\u003e surface/http","label":"the new state","text":"Back up through the domain."},{"hops":"surface/http -\u003e browser","calls":["surface/http.thread"],"label":"201 · the thread · an event to every page","text":"The page gets the thread with its comment; every open page gets the event.","fan":true}]},{"id":"list","tab":"ls","title":"A read: git board ls","intro":"Every list reads the view, a disposable read model kept up to date by the entities that moved, never rebuilt. A fresh view costs one listing of the heads.","toggles":[{"id":"moved","label":"another clone moved some issues","tag":"load what moved"}],"steps":[{"hops":"cmd/git-board -\u003e surface/cli","calls":["surface/cli.list"],"label":"git board ls [filter]","text":"The binary is the CLI. ls and view share one function."},{"hops":"surface/cli -\u003e app","calls":["surface/cli.open","app.Open"],"label":"app.Open","text":"Opens the repository, its datastore (board.datastore), the view, .git-board.toml and who writes (board.me).","by":{"store=md":"Opens the repository, the Markdown folder, the view in .git/board/v2/view.db and the folder's renderer.","store=pg":"Opens the repository, the PostgreSQL datastore and, because it is shared and speaks SQL, the view in the same database (view.OpenPG)."}},{"hops":"surface/cli -\u003e domain/issues","calls":["domain/issues.Service.List"],"label":"Issues.List(ctx, req)","text":"The same call the HTTP API makes for GET /api/issues."},{"hops":"domain/issues -\u003e domain/people","calls":["domain/people.Read"],"label":"people.Read","text":"Who is who, for the filter's @me and the authors."},{"hops":"domain/issues -\u003e kernel","calls":["kernel.K.List","kernel.Board.Snapshot"],"label":"Kind.List(query)","text":"The kernel brings the view to the datastore's heads first, once per kind and per snapshot."},{"hops":"kernel -\u003e store -\u003e $store","calls":["kernel.Board.fresh","store.Datastore.Heads","$store.$storeType.Heads"],"label":"Heads(issue)","text":"One version per entity.","by":{"store=git":"One version per entity: the loose refs, then packed-refs, parsed once. About 5 ms on 20,000 issues.","store=md":"One version per entity: each .jsonl file hashed, so a Markdown board is for a few thousand issues.","store=pg":"One version per entity: one query on git_board.entities."}},{"hops":"kernel -\u003e view","calls":["kernel.Board.freshKind","kernel.View.Mark","kernel.Sum"],"label":"Mark: compare Sum(listing)","text":"The listing's sum against the one the view stored. Equal: the view is fresh, the common case."},{"hops":"kernel -\u003e store -\u003e $store","calls":["kernel.Board.load","store.Datastore.Load"],"label":"Load(the refs that moved)","text":"Only the entities new or moved, read on every CPU while they fold. One missing from the listing is read too before it is dropped: a listing that missed an issue costs a read, never an issue.","when":"moved"},{"hops":"kernel -\u003e view","calls":["kernel.Board.stream","kernel.batch","kernel.View.Write"],"label":"Write, in batches of 2,048","text":"Each batch one transaction, each row only where the stored version is still the base: a row another process wrote meanwhile is left to it.","when":"moved"},{"hops":"kernel -\u003e view","calls":["kernel.View.Rows","view.View.Rows","view.PG.Rows"],"label":"Rows(query)","text":"The rows hold what a list shows and no text: the terms table narrows a filter first."},{"hops":"view -\u003e kernel -\u003e domain/issues -\u003e surface/cli","label":"[]issues.Issue","text":"Printed as a table, --json, --jq, --template or --md. No issue was folded."}]},{"id":"events","tab":"Events","title":"Change events: a write the server didn't make","intro":"A write through the API is told as it lands (A write). One from another clone, another machine or the command line is found by the server's watcher, which compares the datastore's heads every interval.","steps":[{"hops":"cmd/git-board -\u003e surface/cli -\u003e domain/issues -\u003e kernel -\u003e store -\u003e $store","calls":["kernel.K.Do","store.Datastore.Add"],"label":"git board comment … (another process)","text":"A write lands in the datastore without going through the server."},{"node":"surface/http","calls":["surface/http.Server.watch"],"label":"watch: a tick","text":"Every interval the watcher also checks .git-board.toml, and opens the board again when it changed."},{"hops":"surface/http -\u003e kernel -\u003e store -\u003e $store","calls":["surface/http.Server.heads","kernel.Board.Store","store.Datastore.Heads","surface/http.watchedKinds"],"label":"Store().Heads(issue, person)","text":"The server reads the heads through the board's datastore."},{"hops":"$store -\u003e store -\u003e kernel -\u003e surface/http","label":"a version moved","text":"It differs from the one last told: the change is pending, told next tick, so a write the API made meanwhile is told once, by its own observer."},{"node":"surface/http","calls":["surface/http.Server.publish"],"label":"the next tick: publish","text":"What is still pending is published."},{"hops":"surface/http -\u003e browser","routes":["surface/http:GET /api/events"],"label":"GET /api/events → every page","text":"Every open page hears it, whoever wrote and from wherever.","fan":true}]},{"id":"sync","tab":"Forge sync","title":"A forge sync: one engine, mappers as plug-ins","intro":"The engine runs each mapper over the forges that carry its kind: issues first, then releases, then a GitHub Project. Each is a reader and writer of the datastore like any other, so a board in PostgreSQL syncs as one in git does.","toggles":[{"id":"releases","label":"[release] publishes binaries","tag":"the release mapper"},{"id":"project","label":"[github-project] names a Project","tag":"the Project mapper"}],"steps":[{"hops":"cmd/git-board -\u003e surface/cli -\u003e app","calls":["app.Board.SyncForges"],"label":"git board sync","text":"app opens the forges of the board, with their tokens, and builds the mappers."},{"hops":"app -\u003e sync","calls":["sync.Run","sync.Mapper"],"label":"sync.Run(board, way, forges, mappers…)","text":"The engine. A mapper no forge carries is skipped; the first error stops the run."},{"hops":"sync -\u003e domain/issues/issuesync","calls":["sync.Mapper.Run","domain/issues/issuesync.Mapper.Run","domain/issues/issuesync.Sync"],"label":"issuesync.Mapper.Run","text":"The issues' mapper: v1's syncer, ported, its 85 tests green."},{"hops":"domain/issues/issuesync -\u003e sync -\u003e store","calls":["sync.Lock","store.Locker"],"label":"sync.Lock: sync.lock, the journal","text":"In .git/board on this machine: two runs on one machine never overlap, and v1 and v2 share the lock.","by":{"store=pg":"In .git/board on this machine, and the board's advisory lock in the database (store.Locker): two machines never sync one board at once."}},{"hops":"domain/issues/issuesync -\u003e kernel -\u003e store -\u003e $store","calls":["sync.Kind"],"label":"the sync records","text":"Links, last seen values and what was posted are operations in sync entities, read like any issue."},{"hops":"domain/issues/issuesync -\u003e forge -\u003e $forge -\u003e forges","calls":["forge.Forge.Issues","$forge.$forgeType.Issues"],"label":"Issues(since the last run)","text":"What the forge changed since the last run started."},{"node":"domain/issues/issuesync","calls":["domain/issues/issuesync.run.plan"],"label":"plan","text":"Each field compared with its last seen value, on both sides: pull theirs, push ours, or a conflict."},{"hops":"domain/issues/issuesync -\u003e kernel -\u003e store -\u003e $store","calls":["kernel.K.Do","store.Datastore.Add"],"label":"pull: Do(issue …), Do(sync …)","text":"Their changes become packs, through the same compare-and-swap as a write from the page: a write made during the sync is safe, and the page never sees v1's 409 syncing."},{"hops":"domain/issues/issuesync -\u003e forge -\u003e $forge -\u003e forges","calls":["forge.Forge.CreateComment","forge.Forge.SetTitle","forge.Forge.SetStatus"],"label":"push: comments, titles, status…","text":"Our changes, as the forge's writes, and the sync records note what was posted."},{"hops":"app -\u003e domain/releases/releasesync","calls":["app.Board.releaseMapper","domain/releases/releasesync.Mapper.Run"],"label":"the release mapper","text":"The second mapper, publish only: the board's releases to the forge.","when":"releases"},{"hops":"domain/releases/releasesync -\u003e forge -\u003e $forge -\u003e forges","calls":["forge.Releaser"],"label":"publish the releases","text":"Through forge.Releaser, to GitHub and GitLab alike.","when":"releases"},{"hops":"sync -\u003e tools/ghproject -\u003e forge/github -\u003e forges","calls":["tools/ghproject.Mapper.Run","forge/github.ProjectV2"],"label":"the GitHub Project mapper","text":"The third mapper: a Project's fields, decided field by field against the base both last agreed on, through GitHub's GraphQL API.","when":"project"}]}],"where":{"file":"docs/spec/data-flow.md","section":"What lives where","param":"store","columns":{"forgecopy":4,"git":1,"md":3,"pg":2},"rows":[["issues, people, sync and release records","`refs/board/\u003ckind\u003e/\u003cid\u003e`","`git_board.packs`, `git_board.entities`","`\u003cdir\u003e/.board/\u003ckind\u003e/\u003cid\u003e.jsonl`, one pack a line, and `\u003cdir\u003e/NNN-slug.md` rendered","a git copy in `.git/board/forge-copy.git`, filled by sync"],["project numbers","`refs/board/seq`","`git_board.counter`","the forges' own numbers only","the forges' own numbers only"],["the view","`.git/board/v2/view.db` (sqlite)","`git_board_view_v1.*`, shared","`.git/board/v2/view.db`","`.git/board/v2/view.db`"],["who you write as","git config `board.me`","git config `board.me`","git config `board.me`","git config `board.me`"],["sync lock and journal, caches","`.git/board/`","`.git/board/`, and the board's sync lock in the database","`.git/board/`","`.git/board/`"],["the files' lock (read-in, write, render)","","","`\u003cdir\u003e/.board/board.lock`",""],["branches, diffs, tags, check notes","the code repository","the code repository","the code repository","the code repository"],["`.git-board.toml`","the code checkout","the code checkout","the code checkout","the code checkout"]],"heading":["git","PostgreSQL","Markdown files","the forges alone"]}};

/* ---------- the graph ---------- */
const NS = 'http://www.w3.org/2000/svg';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const P = Object.fromEntries(DATA.packages.map(p => [p.id, p]));
const groupOf = id => P[id] ? (id.split('/')[0]) : 'ext';
const importers = {};
for (const p of DATA.packages) for (const i of p.imports) (importers[i] ||= []).push(p.id);

// rank: 0 for a package that imports nothing, else one above its deepest import
const rank = {};
function rk(id) { if (id in rank) return rank[id]; rank[id] = 0; const r = P[id].imports.length ? 1 + Math.max(...P[id].imports.map(rk)) : 0; return rank[id] = r; }
DATA.packages.forEach(p => rk(p.id));
const maxRank = Math.max(...Object.values(rank));
const rows = Array.from({ length: maxRank + 1 }, () => []);
for (const p of DATA.packages) rows[maxRank - rank[p.id]].push(p.id);
const GORDER = ['cmd', 'surface', 'app', 'tools', 'domain', 'sync', 'forge', 'view', 'kernel', 'store', 'conf'];
const gIdx = g => { const i = GORDER.indexOf(g); return i < 0 ? GORDER.length : i; };
rows.forEach(r => r.sort((a, b) => gIdx(groupOf(a)) - gIdx(groupOf(b)) || a.localeCompare(b)));
// order within rows: barycenter sweeps over every neighbour, positions normalised per row
const pos = {};
const setPos = () => rows.forEach(r => r.forEach((id, i) => pos[id] = r.length > 1 ? i / (r.length - 1) : .5));
setPos();
for (let it = 0; it < 8; it++) {
  for (const r of (it % 2 ? [...rows].reverse() : rows)) {
    // an outside thing pulls the packages it talks to towards its side, three times as hard
    const pull = id => DATA.externals.filter(x => x.links.includes(id)).flatMap(x => Array(3).fill(x.side === 'left' ? 0 : 1));
    const bc = id => { const n = [...P[id].imports, ...(importers[id] || [])].map(x => pos[x]).concat(pull(id)); return n.length ? n.reduce((s, x) => s + x, 0) / n.length : pos[id]; };
    const b = Object.fromEntries(r.map(id => [id, bc(id)]));
    r.sort((x, y) => b[x] - b[y] || x.localeCompare(y));
    setPos();
  }
}

// geometry
const NW = 132, NH = 40, SLOT = 148, RH = 76, TOP = 20;
const maxRow = Math.max(...rows.map(r => r.length));
const extL = DATA.externals.some(x => x.side === 'left'), extR = DATA.externals.some(x => x.side === 'right');
const MARGIN = 26, SIDE = 150;
const W = MARGIN * 2 + maxRow * SLOT + (extL ? SIDE : 0) + (extR ? SIDE : 0);
const H = TOP + rows.length * RH;
const cx0 = MARGIN + (extL ? SIDE : 0) + maxRow * SLOT / 2;
const N = {};
rows.forEach((r, ri) => r.forEach((id, i) => {
  N[id] = { id, x: cx0 + (i - (r.length - 1) / 2) * SLOT, y: TOP + ri * RH + NH / 2, w: NW, h: NH, g: groupOf(id), ext: false };
}));
for (const x of DATA.externals) {
  const near = N[x.near];
  N[x.id] = { id: x.id, x: x.side === 'left' ? MARGIN + SIDE / 2 - 6 : W - MARGIN - SIDE / 2 + 6, y: near.y, w: 124, h: NH + 6, g: 'ext', ext: x };
}

// edges: importer → imported; externals → the packages they talk to
const E = {};
const key = (a, b) => a + '>' + b;
for (const p of DATA.packages) for (const i of p.imports) E[key(p.id, i)] = { from: p.id, to: i, ext: false };
for (const x of DATA.externals) for (const l of x.links) E[key(x.id, l)] = { from: x.id, to: l, ext: true };
// ports: a node's outgoing edges spread along its bottom by their target's x, incoming along its top
const out = {}, inc = {};
for (const e of Object.values(E)) if (!e.ext) { (out[e.from] ||= []).push(e); (inc[e.to] ||= []).push(e); }
const spread = (list, n, other) => {
  list.sort((a, b) => N[a[other]].x - N[b[other]].x);
  list.forEach((e, i) => e[other === 'to' ? 'sx' : 'tx'] = N[n].x + (list.length > 1 ? (i / (list.length - 1) - .5) * N[n].w * .72 : 0));
};
for (const n in out) spread(out[n], n, 'to');
for (const n in inc) spread(inc[n], n, 'from');
for (const e of Object.values(E)) {
  const a = N[e.from], b = N[e.to];
  if (e.ext) {
    const dir = b.x > a.x ? 1 : -1, sx = a.x + dir * a.w / 2, tx = b.x - dir * b.w / 2;
    const dx = (tx - sx) / 2;
    e.d = `M${sx},${a.y} C${sx + dx},${a.y} ${tx - dx},${b.y} ${tx},${b.y}`;
  } else {
    const sy = a.y + a.h / 2, ty = b.y - b.h / 2, dy = Math.min(46, (ty - sy) * .55);
    e.d = `M${e.sx.toFixed(1)},${sy} C${e.sx.toFixed(1)},${sy + dy} ${e.tx.toFixed(1)},${ty - dy} ${e.tx.toFixed(1)},${ty}`;
  }
}
function edgeOf(a, b) { if (E[key(a, b)]) return { e: E[key(a, b)], back: false }; if (E[key(b, a)]) return { e: E[key(b, a)], back: true }; return null; }

/* ---------- drawing ---------- */
const svg = document.getElementById('map');
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
function el(tag, attrs = {}, parent) { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) if (v != null) e.setAttribute(k, v); if (parent) parent.appendChild(e); return e; }
function txt(parent, x, y, s, cls, anchor = 'middle') { const t = el('text', { x, y, 'text-anchor': anchor, 'dominant-baseline': 'middle', class: cls }, parent); t.textContent = s; return t; }
const gE = el('g', {}, svg), gN = el('g', {}, svg), gO = el('g', {}, svg);
for (const [k, e] of Object.entries(E)) {
  e.g = el('g', { class: 'edge' + (e.ext ? ' ext' : '') }, gE);
  e.path = el('path', { class: 'line', d: e.d }, e.g);
}
const ghosts = [];
for (const n of Object.values(N)) {
  const g = el('g', { class: 'node' + (n.ext ? ' ext' : ''), tabindex: 0, style: `--c: var(--g-${n.g})` }, gN);
  const l = n.x - n.w / 2, t = n.y - n.h / 2;
  if (n.id === 'browser') for (const o of [10, 5]) ghosts.push(el('rect', { class: 'ghost', x: l + o, y: t - o, width: n.w, height: n.h, rx: 6 }, g));
  el('rect', { class: 'shape', x: l, y: t, width: n.w, height: n.h, rx: n.ext ? n.h / 2 : 6 }, g);
  if (!n.ext) el('rect', { class: 'bar', x: l, y: t + 6, width: 3, height: n.h - 12, rx: 1.5 }, g);
  n.ring = el('rect', { class: 'ring', x: l - 4, y: t - 4, width: n.w + 8, height: n.h + 8, rx: n.ext ? n.h / 2 + 4 : 9 }, g);
  if (n.ext) { txt(g, n.x, n.y - 6, n.ext.title, 'name'); txt(g, n.x, n.y + 9, n.ext.sub || '', 'pre'); }
  else {
    const cut = n.id.lastIndexOf('/');
    if (cut > 0) { txt(g, n.x, n.y - 8, n.id.slice(0, cut + 1), 'pre'); txt(g, n.x, n.y + 7, n.id.slice(cut + 1), 'name'); }
    else txt(g, n.x, n.y + 1, n.id, 'name');
  }
  n.el = g;
  g.addEventListener('mouseenter', () => hover(n.id));
  g.addEventListener('focus', () => hover(n.id));
  g.addEventListener('mouseleave', unhover);
  g.addEventListener('blur', unhover);
  g.addEventListener('click', () => { if (state.story === 'map') { state.pick = state.pick === n.id ? null : n.id; render(); } });
}
const packet = el('g', { class: 'packet', style: 'display:none' }, gO);
el('circle', { class: 'halo', r: 9 }, packet); el('circle', { class: 'dot', r: 4.5 }, packet);
const hop = el('g', { class: 'hop', style: 'display:none' }, gO);
const hopRect = el('rect', { rx: 4, height: 19 }, hop), hopText = el('text', { 'dominant-baseline': 'middle', 'text-anchor': 'middle' }, hop);

/* ---------- state ---------- */
const S = Object.fromEntries(DATA.stories.map(s => [s.id, s]));
const state = { story: 'map', params: {}, toggles: {}, speed: 1, playing: false, step: -1, pick: null };
for (const p of DATA.params) state.params[p.id] = p.options[0].id;
const opt = (pid, oid) => DATA.params.find(p => p.id === pid).options.find(o => o.id === oid);
const sub = s => s.replace(/\$([a-z]+)(Type)?/g, (m, id, t) => { const o = opt(id, state.params[id]); return t ? o.type : o.pkg; });
const anim = { token: 0 };
let done = new Set(), hot = null;

function steps() {
  if (state.story === 'map') return [];
  return S[state.story].steps.map((s, i) => ({ ...s, i, on: !s.when || (s.when.includes('=') ? state.params[s.when.split('=')[0]] === s.when.split('=')[1] : !!state.toggles[s.when]) }));
}
const textOf = s => { if (s.by) for (const [k, v] of Object.entries(s.by)) { const [p, o] = k.split('='); if (state.params[p] === o) return v; } return s.text || ''; };
const hopsOf = s => s.hops ? sub(s.hops).split('->').map(x => x.trim()) : [];
const nextOn = i => { const ss = steps(); for (let k = i + 1; k < ss.length; k++) if (ss[k].on) return k; return -1; };
const prevOn = i => { const ss = steps(); for (let k = i - 1; k >= 0; k--) if (ss[k].on) return k; return -1; };
const usesParam = (story, pid) => JSON.stringify(story.steps).includes('$' + pid) || JSON.stringify(story.steps).includes('"' + pid + '=');

function involved() {
  const es = new Set(), ns = new Set();
  for (const s of steps()) {
    if (!s.on) continue;
    const h = hopsOf(s);
    h.forEach(x => ns.add(x));
    for (let j = 0; j + 1 < h.length; j++) { const r = edgeOf(h[j], h[j + 1]); if (r) es.add(r.e); }
    if (s.node) ns.add(sub(s.node));
  }
  return { es, ns };
}
const pkgsOfParam = pid => DATA.params.find(p => p.id === pid).options.map(o => o.pkg);

/* ---------- render ---------- */
function render() {
  const story = state.story !== 'map';
  const inv = story ? involved() : null;
  const cur = state.step >= 0 ? steps()[state.step] : null;
  const curE = new Set();
  if (cur) { const h = hopsOf(cur); for (let j = 0; j + 1 < h.length; j++) { const r = edgeOf(h[j], h[j + 1]); if (r) curE.add(r.e); } }
  const visE = new Set(), visN = new Set();
  for (const s of steps()) if (done.has(s.i)) { const h = hopsOf(s); h.forEach(x => visN.add(x)); for (let j = 0; j + 1 < h.length; j++) { const r = edgeOf(h[j], h[j + 1]); if (r) visE.add(r.e); } if (s.node) visN.add(sub(s.node)); }
  const offPkgs = new Set();
  for (const p of DATA.params) for (const o of p.options) if (o.id !== state.params[p.id]) offPkgs.add(o.pkg);
  const pick = !story && state.pick;
  for (const e of Object.values(E)) {
    const c = ['edge'];
    if (e.ext) c.push('ext');
    if (story) { if (!inv.es.has(e)) c.push('dim'); else if (curE.has(e)) {} else if (visE.has(e)) c.push('visited'); else c.push('on'); }
    else if (pick) { if (e.from === pick) c.push('down'); else if (e.to === pick) c.push('up'); else c.push('dim'); }
    e.g.setAttribute('class', c.join(' '));
  }
  for (const n of Object.values(N)) {
    const c = ['node'];
    if (n.ext) c.push('ext');
    if (story) { if (!inv.ns.has(n.id)) c.push('dim'); else if (visN.has(n.id)) c.push('visited'); if (offPkgs.has(n.id) && !inv.ns.has(n.id)) c.push('off'); }
    else if (pick) { if (n.id === pick) c.push('picked'); else if (edgeOf(n.id, pick)) c.push('peer'); else c.push('dim'); }
    n.el.setAttribute('class', c.join(' '));
  }
  packet.style.display = 'none'; hop.style.display = 'none';
  renderPanel();
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const md = s => esc(s).replace(/`([^`]+)`/g, '$1');
const docOf = id => (P[id] ? P[id].doc : (DATA.externals.find(x => x.id === id) || {}).doc || '').replace(/^(Package|Command) \S+ is /, '');

function renderPanel() {
  const story = state.story !== 'map';
  const s = story ? S[state.story] : null;
  $('story-head').innerHTML = story ? `<h2>${esc(s.title)}</h2><p>${esc(s.intro)}</p>` :
    `<h2>The packages, as the code imports them</h2><p>${DATA.packages.length} packages, ${DATA.packages.reduce((n, p) => n + p.imports.length, 0)} imports, read from the code by flowgen. Hover or click a package for what it is and what it imports.</p>`;
  $('transport').hidden = !story;
  $('toggles').innerHTML = story && s.toggles ? s.toggles.map(t => `<label class="toggle"><input type="checkbox" data-toggle="${t.id}" ${state.toggles[t.id] ? 'checked' : ''}><span>${esc(t.label)}${t.tag ? ` <span class="tag">${esc(t.tag)}</span>` : ''}</span></label>`).join('') : '';
  $('legend').innerHTML = story ? '' : '<span class="sw"></span>what it imports · <span class="sw up"></span>what imports it';
  $('legend').hidden = story && false;
  for (const p of DATA.params) {
    const lab = document.querySelector(`[data-param-group="${p.id}"]`);
    if (lab) lab.classList.toggle('unused', story && !usesParam(s, p.id));
  }
  if (story) {
    const ss = steps(); let k = 0;
    $('steps').innerHTML = ss.map(st => {
      const n = st.on ? ++k : '·';
      const tag = st.on ? '' : `<span class="tag">${esc(st.when.includes('=') ? opt(...st.when.split('=')).name + ' only' : (s.toggles.find(t => t.id === st.when) || {}).label)}</span>`;
      const cls = ['step', st.i === state.step && 'is-current', done.has(st.i) && 'is-done', !st.on && 'is-off', st.warn && 'warn'].filter(Boolean).join(' ');
      const calls = [...(st.calls || []).map(sub), ...(st.routes || []).map(r => sub(r).split(':')[1])];
      return `<li class="${cls}" data-i="${st.i}" tabindex="0" role="button"><span class="n">${n}</span><span class="lbl">${esc(st.label)}${tag}</span>${textOf(st) ? `<p class="txt">${esc(textOf(st))}</p>` : ''}${calls.length ? `<p class="calls">${esc(calls.join(' · '))}</p>` : ''}</li>`;
    }).join('');
    const list = $('steps'), c = list.querySelector('.is-current');
    if (c) { const t = c.offsetTop, b = t + c.offsetHeight; if (t < list.scrollTop) list.scrollTop = t - 4; else if (b > list.scrollTop + list.clientHeight) list.scrollTop = b - list.clientHeight + 4; }
    $('mapinfo').innerHTML = '';
  } else {
    $('steps').innerHTML = '';
    const id = state.pick;
    $('mapinfo').innerHTML = id ? pkgCard(id) : '';
  }
  renderWhere(); renderTransport();
}
function pkgCard(id) {
  const n = N[id], p = P[id];
  const imp = p ? p.imports : [], by = (importers[id] || []);
  return `<div class="picked-pkg" style="--c: var(--g-${n.g})"><div class="t">${esc(p ? id : n.ext.title)}</div><p class="d">${esc(docOf(id))}</p>` +
    (p ? `<div class="l"><b>imports</b> ${imp.length ? esc(imp.join(' · ')) : 'nothing of the module'}</div><div class="l"><b>imported by</b> ${by.length ? esc(by.join(' · ')) : 'no one: the binary'}</div>` : '') + '</div>';
}
function renderWhere() {
  const w = DATA.where;
  if (!w) { $('where-group').hidden = true; return; }
  const p = DATA.params.find(x => x.id === w.param), i = p.options.findIndex(o => o.id === state.params[w.param]);
  $('where-label').textContent = `What lives where · ${w.heading[i]}`;
  $('where').innerHTML = w.rows.map(r => `<div><dt>${md(r[0])}</dt><dd>${md(r[i + 1])}</dd></div>`).join('');
}
function renderTransport() {
  if (state.story === 'map') return;
  const ss = steps(), on = ss.filter(s => s.on).length;
  const idx = state.step < 0 ? 0 : ss.slice(0, state.step + 1).filter(s => s.on).length;
  const atEnd = state.step >= 0 && nextOn(state.step) < 0;
  $('btn-play').textContent = state.playing ? '❚❚ pause' : atEnd ? '↻ replay' : '▶ play';
  $('btn-prev').disabled = state.step < 0 || prevOn(state.step) < 0;
  $('btn-next').disabled = atEnd;
  $('pos').textContent = `${idx} / ${on}`;
}

/* ---------- animation ---------- */
function setHot(id, warn) {
  if (hot) N[hot].el.classList.remove('hot', 'warn');
  hot = id; const n = N[id]; n.el.classList.remove('dim', 'off'); n.el.classList.add('hot'); if (warn) n.el.classList.add('warn');
  n.ring.classList.remove('go'); void n.ring.getBoundingClientRect(); n.ring.classList.add('go');
}
function showHop(st, at) {
  const label = st.label, w = Math.min(340, label.length * 6.7 + 18);
  let x = at.x + 14, y = at.y - 10;
  if (x + w > W - 4) x = at.x - 14 - w;
  x = Math.max(4, x); y = Math.max(2, Math.min(H - 22, y));
  hop.style.display = ''; hop.setAttribute('class', 'hop' + (st.warn ? ' warn' : ''));
  hopRect.setAttribute('x', x); hopRect.setAttribute('y', y); hopRect.setAttribute('width', w);
  hopText.setAttribute('x', x + w / 2); hopText.setAttribute('y', y + 10); hopText.textContent = label;
}
const wait = (ms, token) => new Promise(r => setTimeout(() => r(token === anim.token), ms));
function travel(seg, token, warn) {
  return new Promise(res => {
    const p = seg.e.path, L = p.getTotalLength();
    const dur = reduced ? 140 : Math.max(420, L / .3) / state.speed, t0 = performance.now();
    packet.style.display = ''; packet.setAttribute('class', 'packet' + (warn ? ' warn' : ''));
    (function frame(now) {
      if (token !== anim.token) return res(false);
      const t = Math.min(1, (now - t0) / dur), e = t < .5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
      const pt = p.getPointAtLength(seg.back ? L * (1 - e) : L * e);
      packet.setAttribute('transform', `translate(${pt.x.toFixed(1)},${pt.y.toFixed(1)})`);
      if (t < 1) requestAnimationFrame(frame); else res(true);
    })(t0);
  });
}
async function runStep(idx) {
  const token = ++anim.token, ss = steps(), st = ss[idx];
  if (!st || !st.on) return;
  state.step = idx;
  done = new Set(ss.filter(s => s.on && s.i < idx).map(s => s.i));
  if (hot) { N[hot].el.classList.remove('hot', 'warn'); hot = null; }
  render();
  if (st.hops) {
    const h = hopsOf(st), segs = [];
    for (let j = 0; j + 1 < h.length; j++) segs.push({ ...edgeOf(h[j], h[j + 1]), to: h[j + 1] });
    const mid = segs[Math.floor((segs.length - 1) / 2)], mp = mid.e.path.getPointAtLength(mid.e.path.getTotalLength() / 2);
    showHop(st, mp);
    setHot(h[0], st.warn);
    for (const sg of segs) {
      sg.e.g.setAttribute('class', 'edge active' + (st.warn ? ' warn' : '') + (sg.e.ext ? ' ext' : ''));
      if (!await travel(sg, token, st.warn)) return;
      setHot(sg.to, st.warn);
    }
    if (st.fan) for (const g of ghosts) { g.classList.remove('flash'); void g.getBoundingClientRect(); g.classList.add('flash'); }
  } else {
    const n = N[sub(st.node)];
    showHop(st, { x: n.x + n.w / 2 - 10, y: n.y - n.h / 2 - 6 });
    setHot(n.id, st.warn);
    if (!await wait(reduced ? 200 : 900 / state.speed, token)) return;
  }
  packet.style.display = 'none';
  done.add(idx);
  if (!await wait(Math.min(4200, 1100 + textOf(st).length * 15) / state.speed, token)) return;
  if (state.playing) { const n = nextOn(idx); if (n < 0) { state.playing = false; renderTransport(); } else runStep(n); }
}
function goTo(i, play) { if (play !== undefined) state.playing = play; renderTransport(); runStep(i); }

/* ---------- hover ---------- */
function hover(id) {
  const tip = $('tip'), n = N[id], p = P[id];
  tip.innerHTML = `<div class="t1">${esc(p ? id : n.ext.title)}</div><div>${esc(docOf(id))}</div>` + (p ? `<div class="l">imports ${p.imports.length} · imported by ${(importers[id] || []).length} · ${p.files} files</div>` : '');
  tip.style.display = 'block';
  const wrap = tip.parentElement.getBoundingClientRect(), r = n.el.getBoundingClientRect();
  let left = r.left - wrap.left + r.width / 2 - 160, top = r.bottom - wrap.top + 8;
  left = Math.max(4, Math.min(wrap.width - 324, left));
  if (top + tip.offsetHeight > wrap.height - 30) top = r.top - wrap.top - tip.offsetHeight - 8;
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
  if (state.story === 'map' && !state.pick) {
    for (const e of Object.values(E)) e.g.setAttribute('class', 'edge' + (e.ext ? ' ext' : '') + (e.from === id ? ' down' : e.to === id ? ' up' : ' dim'));
    for (const m of Object.values(N)) m.el.setAttribute('class', 'node' + (m.ext ? ' ext' : '') + (m.id === id ? ' picked' : edgeOf(m.id, id) ? ' peer' : ' dim'));
  }
}
function unhover() { $('tip').style.display = 'none'; if (state.story === 'map') render(); }

/* ---------- wiring ---------- */
$('stories').innerHTML = [['map', 'Map'], ...DATA.stories.map(s => [s.id, s.tab])].map(([id, t]) => `<label><input type="radio" name="story" value="${id}">${esc(t)}</label>`).join('');
$('params').innerHTML = DATA.params.map(p => `<div class="group" style="margin-top:2px"><div class="group-label">${esc(p.label)}</div><div class="seg" data-param-group="${p.id}">${p.options.map(o => `<label><input type="radio" name="param-${p.id}" value="${o.id}" ${o.id === state.params[p.id] ? 'checked' : ''}>${esc(o.name)}</label>`).join('')}</div></div>`).join('');
const groups = [...new Set(Object.values(N).map(n => n.g))].sort((a, b) => gIdx(a) - gIdx(b));
$('groups').innerHTML = groups.map(g => `<span style="--c: var(--g-${g})"><i></i>${g === 'ext' ? 'outside' : g}</span>`).join('');
const total = DATA.stories.reduce((n, s) => n + s.steps.length, 0);
$('footer').innerHTML = `Drawn by <code>tools/flowgen</code> from the code (what <code>${esc(DATA.binary)}</code> links) and the ${total} steps of <code>docs/spec/flows.json</code>, each checked against the code for every datastore and forge: a step that names a function the code doesn't have, or two packages that don't import each other, fails the build. <i>What lives where</i> is <code>docs/spec/data-flow.md</code>'s table.`;

function selectStory(id, play = true) {
  if (id !== 'map' && !S[id]) id = 'map';
  state.story = id; state.step = -1; state.pick = null; done = new Set(); ++anim.token;
  if (hot) { N[hot].el.classList.remove('hot', 'warn'); hot = null; }
  try { if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id); } catch (e) { /* ignore */ }
  const r = document.querySelector(`input[name=story][value="${id}"]`); if (r) r.checked = true;
  render();
  if (id !== 'map' && play) goTo(nextOn(-1), !reduced); else state.playing = false;
}
function rerunCurrent() {
  if (state.story === 'map' || state.step < 0) { render(); return; }
  const ss = steps(); if (ss[state.step].on) runStep(state.step); else { const n = nextOn(state.step); runStep(n >= 0 ? n : prevOn(state.step)); }
}
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.name === 'story') selectStory(t.value);
  else if (t.name === 'speed') state.speed = Number(t.value);
  else if (t.name && t.name.startsWith('param-')) { state.params[t.name.slice(6)] = t.value; try { localStorage.setItem('git-board-flow.' + t.name, t.value); } catch (e) { /* ignore */ } rerunCurrent(); }
  else if (t.dataset.toggle) { state.toggles[t.dataset.toggle] = t.checked; rerunCurrent(); }
});
$('btn-play').addEventListener('click', () => {
  if (state.playing) { state.playing = false; ++anim.token; renderTransport(); return; }
  const atEnd = state.step >= 0 && nextOn(state.step) < 0;
  goTo(atEnd || state.step < 0 ? nextOn(-1) : state.step, true);
});
$('btn-next').addEventListener('click', () => { const n = nextOn(state.step); if (n >= 0) goTo(n, false); });
$('btn-prev').addEventListener('click', () => { const p = prevOn(state.step); if (p >= 0) goTo(p, false); });
$('steps').addEventListener('click', ev => {
  const li = ev.target.closest('.step'); if (!li) return;
  const st = S[state.story].steps[Number(li.dataset.i)];
  if (st.when) {
    if (st.when.includes('=')) { const [p, o] = st.when.split('='); state.params[p] = o; const r = document.querySelector(`input[name="param-${p}"][value="${o}"]`); if (r) r.checked = true; }
    else state.toggles[st.when] = true;
  }
  goTo(Number(li.dataset.i), false);
});
$('steps').addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); ev.target.click(); } });
document.addEventListener('keydown', ev => {
  if (state.story === 'map' || /input|button|textarea|select/i.test(ev.target.tagName)) return;
  if (ev.key === 'ArrowRight') { const n = nextOn(state.step); if (n >= 0) goTo(n, false); }
  else if (ev.key === 'ArrowLeft') { const p = prevOn(state.step); if (p >= 0) goTo(p, false); }
  else if (ev.key === ' ') { ev.preventDefault(); $('btn-play').click(); }
});
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id !== state.story && (S[id] || id === 'map')) selectStory(id); });
for (const p of DATA.params) { try { const v = localStorage.getItem('git-board-flow.param-' + p.id); if (v && p.options.some(o => o.id === v)) { state.params[p.id] = v; document.querySelector(`input[name="param-${p.id}"][value="${v}"]`).checked = true; } } catch (e) { /* ignore */ } }
selectStory((location.hash || '#map').slice(1));
</script>

# The docs site: the guide, the core's spec, the decisions. Build it with
# `make docs`, preview it with `make docs-serve`. docs/prd/ and
# docs/implementation-plan.md are the history, in the folder but not on
# the site.
[project]
site_name = "git-board"
docs_dir = "docs"
site_dir = "site"
# no Go file is a page: a copy in site/ would be a package of the module
# (v0.11's docs/embed.go was one)
exclude_docs = """
*.go
prd/
implementation-plan.md
"""
nav = [
  { "Overview" = "index.md" },
  { "Manual" = [
    { "User manual" = "manual/index.md" },
    { "Install" = "manual/install.md" },
    { "First steps" = "manual/first-steps.md" },
    { "Everyday work" = "manual/everyday.md" },
    { "Working as a team" = "manual/together.md" },
    { "Owning your issues" = "manual/ownership.md" },
    { "Questions" = "manual/faq.md" },
  ] },
  { "Guide" = [
    { "Issues from the command line" = "guide/cli.md" },
    { "Configuration" = "guide/configuration.md" },
    { "The file's schema version" = "guide/config-schema.md" },
    { "Forges" = "guide/forges.md" },
    { "Where the board is kept" = "guide/datastores.md" },
    { "Performance" = "guide/performance.md" },
  ] },
  { "Spec" = [
    { "How the data flows" = "spec/data-flow.md" },
    { "Data model" = "spec/data-model.md" },
    { "Storage" = "spec/storage.md" },
    { "Other datastores and the counter" = "spec/datastores.md" },
    { "Queries and search" = "spec/queries.md" },
    { "Sync" = "spec/sync.md" },
    { "Forges" = "spec/forges.md" },
    { "Where a value lives" = "spec/places.md" },
    { "Proof notes" = "spec/proof.md" },
  ] },
  { "Decisions" = [
    { "The decisions" = "adr/index.md" },
    { "The spec's decisions" = "spec/decisions.md" },
    { "ADR 0003: the board is the team's" = "adr/0003-own-core-instead-of-git-bug.md" },
    { "ADR 0002: where the board is kept" = "adr/0002-datastores.md" },
    { "ADR 0004: issues are operation logs, fields are labels" = "adr/0004-entities-are-operation-logs.md" },
    { "ADR 0011: shared settings in the file, your own in git config" = "adr/0011-shared-settings-in-git-board-toml.md" },
    { "ADR 0008: one truth, many mirrors, and how they sync" = "adr/0008-sync-state-in-the-data-model.md" },
    { "ADR 0010: no secret is stored, and the server answers on localhost" = "adr/0010-tokens-from-env-or-git-credential-helper.md" },
    { "ADR 0006: one binary, built in layers" = "adr/0006-go-git-reads-git-binary-moves-refs.md" },
    { "ADR 0014: tests on real repositories, few licences" = "adr/0014-hermetic-tests-on-real-repositories.md" },
    { "ADR 0001: proof in git notes, and the opt-in cycle" = "adr/0001-check-results-are-signed-git-notes.md" },
  ] },
  { "Rewrite" = [
    { "v2: the design of a rewrite" = "rewrite/design.md" },
    { "v2: the golden boards and make compat" = "rewrite/compat.md" },
    { "v2: the HTTP API" = "rewrite/api.md" },
    { "v2: the web app" = "rewrite/web.md" },
    { "How v2 came to be" = "rewrite/history.md" },
  ] },
  { "Related work" = "related-work.md" },
]

# The theme and the Markdown extensions are `zensical new`'s defaults.
[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

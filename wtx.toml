# wtx: every branch gets its own worktree, ports, tmux session and agent.
# Reference for every key: https://github.com/EPFL-ENAC/wtx/blob/main/docs/schema.md
schema_version = 1

[repo]
name = "git-board"
base_branch = "main"
# The single source for the push guard, the completion and the deny rules.
protected_branches = ["main"]

[deps]

[[deps.step]]
if_missing = "web/node_modules"
cwd = "web"
run = "npm ci"

# The agent pane fills the left half, the rest stack on the right.
[panes]

[[panes.pane]]
name = "agent"
role = "agent"

[[panes.pane]]
name = "shell"
role = "shell"

[agent]
tool = "opencode"
# opencode models are `provider/model`. The rcp-aias models carry their own
# org path, so these are the full ids already.
llm = "rcp-aias/moonshotai/Kimi-K2.7-Code"

# Plan on one model, implement on another. A brief starts the plan agent on
# plan_model; accepting the plan switches opencode to the build agent, and the
# model follows the agent through the generated opencode.json. The plan's own
# `wtx-effort:` line does nothing under opencode, it belongs to Claude's
# ExitPlanMode handoff. The effort still reaches a brief, as
# `opencode run --variant`.
[agent.orchestration]
enabled = true
plan_model = "rcp-aias/moonshotai/Kimi-K2.7-Code"
build_model = "rcp-aias/moonshotai/Kimi-K2.7-Code"
build_effort = "high"

# opencode's own models. small_model is what a subagent runs on; provider is
# the prefix for a bare model name (the ids above already carry theirs).
[agent.opencode]
provider = "rcp-aias"
small_model = "rcp-aias/zai-org/GLM-5.3-Flash"

# Added to the baseline wtx ships. A repo can tighten, never loosen.
[permissions]
allow = ["Bash(make build)", "Bash(make test)", "Bash(make vet)", "Bash(make fmt)", "Bash(make lint)", "Bash(make ci)", "Bash(go build *)", "Bash(go test *)", "Bash(go vet *)", "Bash(gofmt *)", "Bash(npm run typecheck)", "Bash(npm test)", "Bash(npm run build)"]
deny = ["Bash(git tag *)", "Bash(git push * --tags)", "Bash(git bug push *)", "Bash(git bug bridge *)"]

# Run by `wtx land --local`.
[checks]
lint = ["cd web && npm run typecheck"]
test = ["make ci", "cd web && npm test"]

[[repos]]
name = "git-bug"
path = "../git-bug"
access = "read"   # read free, never writable
base_branch = "bridge-sync"

[[repos]]
name = "co2-calculator"
path = "../co2-calculator"
access = "read"   # read free, never writable
base_branch = "main"

[[repos]]
name = "co2-calculator-back-office-doc"
path = "../co2-calculator-back-office-doc"
access = "read"   # read free, never writable
base_branch = "main"

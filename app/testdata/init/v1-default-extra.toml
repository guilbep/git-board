# git-board's project file. Every key is in docs/guide/configuration.md, and
# beside the editor in Settings → Project file. Without this file every
# `ns:value` label is still a field; this adds their order, single or
# multiple values, sprint dates and saved views.
#
# Conventions
# - Labels are fields: `status:ready`, `prio:p1`, `bug`, `est:2`.
# - Titles: "area: what goes wrong" for a bug, "area: what to do" otherwise.
#   The area is the part of the project the issue is about, one short word
#   the team agrees on: a domain (billing, auth, search), a layer (api, web,
#   db), or the tooling (ci, docs, deps, release). Leave it out when the
#   issue is about the whole project.
#     billing: totals round twice on discounted lines     (bug)
#     auth: session expires after 5 minutes on Safari     (bug)
#     api: GET /invoices returns 500 without a date       (bug)
#     search: find invoices by customer name              (feat)
#     web: show unpaid invoices first                     (feat)
#     db: index invoices by customer                      (perf)
#     ci: run the frontend tests on pull requests         (test)
#     docs: explain how to deploy                         (docs)
#     web: align the totals on the invoice page           (polish)
#     ship the first release to the pilot users           (no area)
#   No [BUG] (the kind says it), no (#123) (the number shows before the
#   title), no final period.
# - Project numbers (ABC-12) are started once in Settings › Numbers.

# The workflow, in order: the board's columns, `git board move --next`, and
# the development cycle's stages (guessed from these names). The last one
# closes the issue.
[fields.status]
single = true
options = ["backlog", "ready", "in-progress", "in-review", "ready-for-validation", "validated"]

[fields.status.descriptions]
backlog = "Known, not yet specified"
in-progress = "Branch created"
in-review = "Pull request open"
ready = "Specified and prioritized; can be started"
ready-for-validation = "Merged into dev, waiting for validation"
validated = "Signed off; released with the next tag"

[fields.status.colors]
backlog = "gray"
in-progress = "yellow"
in-review = "orange"
ready = "blue"
ready-for-validation = "purple"
validated = "green"

# On hold, beside the status, never a status: blocked, or paused.
[fields.hold]
single = true
options = ["blocked", "paused"]

[fields.hold.colors]
blocked = "#b60205"
paused = "#d4c5f9"

[fields.hold.descriptions]
blocked = "waiting for something outside the team, or for another issue"
paused = "deprioritized, or its developer away for a while"

[fields.prio]
single = true
options = ["p0", "p1", "p2", "p3"]

[fields.prio.descriptions]
p0 = "Now: production broken, data at risk, or the team blocked"
p1 = "This cycle: before the next staging review"
p2 = "Soon: the default for accepted work"
p3 = "Someday: when convenient"

[fields.prio.colors]
p0 = "red"
p1 = "orange"
p2 = "yellow"
p3 = "gray"

# The estimate, in hours.
[fields.est]
single = true
numeric = true
options = ["0.5", "1", "2", "4", "8", "16"]

# MoSCoW: is it promised for its milestone? Not a priority, and no bug has
# one. The GitHub Project's option for wont is "Won't".
[fields.moscow]
single = true
options = ["must", "should", "could", "wont"]

[fields.moscow.descriptions]
could = "If time allows; the first to go"
must = "The milestone fails without it"
should = "Important; the milestone survives without it"
wont = "Agreed out of this milestone, on record"

[fields.moscow.colors]
could = "green"
must = "purple"
should = "blue"
wont = "gray"

[fields.moscow.project]
wont = "Won't"

[fields.assignee]
single = false

# The project's people by role: who sets the risk, approves the plan,
# reviews, signs off (docs/guide/configuration.md, Roles and Cycle).
# [roles]
# lead-dev = "your-login"

# Sprints are `sprint:` labels; give them dates with "+ Sprint" for
# sprint:@current to find them.
[sprints]
length_days = 7
start_weekday = "monday"

# An issue's branch: its kind, number, place in the issue's folder and
# title, e.g. bug/vm-12/1-login-fails, then bug/vm-12/2-…; the kind's word
# itself. The kinds are plain labels, GitHub's way (`bug`,
# `feat`), and the kind field all the same: a column, a group, a filter, one
# per issue. Rather `kind:bug` labels? Give [fields.kind] these kinds as
# options.
[branches]
name = "{kind}/{number}/{n}-{slug}"
kinds = { bug = "bug", feat = "feat", polish = "polish", docs = "docs", refactor = "refactor", perf = "perf", test = "test", style = "style", chore = "chore", design = "design" }

# What each kind means, the label's description on GitHub too.
[fields.kind.descriptions]
bug = "Something isn't working: should prefix branch by bug/"
chore = "dependencies, CI, tooling, upgrades, housekeeping"
design = "design work (Figma), usually a sub-issue of the feat it designs"
docs = "Improvements or additions to documentation: should prefix branch by docs/"
feat = "New feature or request: should prefix branch by feat/"
perf = "speed or footprint; behaviour unchanged"
polish = "looks and wording: UI, text, layout, colours; no new capability"
refactor = "code structure; behaviour unchanged"
style = "code formatting only; rarely an issue"
test = "tests only"

[fields.area]
single = true
options = ["backend", "Front End"]

[fields.area.descriptions]
backend = "the API"

[fields.area.colors]
"Front End" = "#c5def5"
backend = "#1d76db"

[fields.due-date]
single = true
type = "date"

[fields.effort]
single = true
numeric = true

[fields.sprint]
single = true
type = "iteration"

[fields.team]
single = true
options = ["data-science", "Web"]

[fields.team.descriptions]
Web = ""
data-science = "the data people"

[fields.team.colors]
Web = "pink"
data-science = "blue"

# Views are the tabs above the issues, in this order; git-board opens on
# the first. Table, board or roadmap is a switch on every view, `layout`
# only the one it opens in: `open`, every open issue, as a forge's issues
# page, is one click from its kanban.
[views.open]
layout = "table"
filter = "is:open"
sort = "prio asc"

[views.backlog]
layout = "table"
filter = "is:open status:backlog,ready"
sort = "prio asc"

[views.assigned-to-me]
layout = "table"
filter = "assignee:@me is:open"
group = "status"

[github-project]
owner = "EPFL-ENAC"
number = 53

[fields.kind.colors]
bug = "#d73a4a"
chore = "#bfdadc"
design = "#f9d0c4"
docs = "#0075ca"
feat = "#3a2ccd"

[labels]
list = ["wontfix", "good first issue"]

[labels.descriptions]
"good first issue" = "Good for newcomers"
wontfix = "This will not be worked on"

[labels.colors]
"good first issue" = "#7057ff"
wontfix = "#ffffff"
